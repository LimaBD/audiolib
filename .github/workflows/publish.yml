name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (testpypi or pypi)"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: write   # for GitHub release
  id-token: write   # for OIDC trusted publishing

jobs:
  # -------------------------------------------------------------------------
  # 1. Build binary wheels for all targets
  # -------------------------------------------------------------------------
  build-wheels:
    name: Build wheel — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Linux aarch64 (cross-compile)
          - runner: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macOS Intel
          - runner: macos-14
            target: x86_64
            manylinux: ""
          # macOS Apple Silicon
          - runner: macos-14
            target: aarch64
            manylinux: ""
          # Windows x86_64
          - runner: windows-latest
            target: x86_64
            manylinux: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >
            --release
            --out dist
            --interpreter 3.8 3.9 3.10 3.11 3.12 3.13
          sccache: true

      - name: Build wheels (macOS / Windows)
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >
            --release
            --out dist
            --interpreter 3.8 3.9 3.10 3.11 3.12 3.13
          sccache: true

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/

  # -------------------------------------------------------------------------
  # 2. Build source distribution
  # -------------------------------------------------------------------------
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  # -------------------------------------------------------------------------
  # 3. Smoke-test the wheels
  # -------------------------------------------------------------------------
  test-wheels:
    name: Test wheel — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: [build-wheels, build-sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Install wheel
        shell: bash
        run: pip install audiolib --find-links dist/ --no-index

      - name: Install test deps
        run: pip install pytest numpy soundfile

      - name: Run smoke tests
        run: pytest tests/ -v --ignore=tests/benchmark.py --ignore=tests/test_compat.py -x

  # -------------------------------------------------------------------------
  # 4. Publish to TestPyPI
  # -------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: test-wheels
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc'))
    environment:
      name: testpypi
      url: https://test.pypi.org/p/audiolib

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # -------------------------------------------------------------------------
  # 5. Publish to PyPI
  # -------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: test-wheels
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc'))
    environment:
      name: pypi
      url: https://pypi.org/p/audiolib

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # -------------------------------------------------------------------------
  # 6. Create GitHub release
  # -------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
